# Generated by tools\configure.ps1 - don't hand-edit the path:
# the number after % is the path length and has to match.
vo=gpu-next
gpu-api=vulkan
profile=high-quality

# YouTube: skip AV1. Cards before RDNA2 / RTX 30 have no hardware
# decoder for it, so AV1 would land on the CPU that MVTools is
# already using. VP9 and H.264 decode in hardware instead.
# Also capped at 1080p, since the filter skips anything wider.
ytdl-format=bestvideo[vcodec!*=av01][height<=?1080]+bestaudio/best[height<=?1080]

vf=vapoursynth=file=%33%G:/Tools/mpv-rife/interpolate.vpy:buffered-frames=2

# VapourSynth needs the frames in system memory, not on the GPU.
hwdec=auto-copy

# The filter already delivers real 60fps; mpv's own
# interpolation only gets in the way.
interpolation=no

# Follow the monitor's true refresh rate and resample audio to
# match. This is what stops the audio from drifting.
video-sync=display-resample
